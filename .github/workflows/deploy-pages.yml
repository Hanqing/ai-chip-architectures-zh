name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages bundle
        env:
          VITE_GITHUB_PAGES: "true"
        run: pnpm build

      - name: Restore deployment media
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" .github-pages-media || true
          mkdir -p dist/public/media
          if [ -d .github-pages-media/media ]; then cp -R .github-pages-media/media/. dist/public/media/; fi
          cp dist/public/index.html dist/public/404.html

      - name: Publish static bundle to gh-pages
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" .github-pages-out
          find .github-pages-out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/public/. .github-pages-out/
          touch .github-pages-out/.nojekyll
          cd .github-pages-out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "Deploy $GITHUB_SHA"
          git push origin gh-pages
